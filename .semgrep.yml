# ============================================================
#  Semgrep — Reglas personalizadas para test.com
#  Complementan las reglas estándar p/owasp-top-ten
#  Elaborado por: Sebastian
# ============================================================

rules:

  # ─── Flask debug=True ─────────────────────────────────────
  - id: flask-debug-true-production
    patterns:
      - pattern: app.run(..., debug=True, ...)
      - pattern: app.run(debug=True)
    message: |
      Flask debug=True detectado. El debugger de Werkzeug permite RCE a cualquier usuario
      con acceso a la aplicación. NUNCA usar debug=True en producción.
      Corrección: usar variable de entorno FLASK_DEBUG=0 en producción.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: CWE-94
      owasp: A05:2021 - Security Misconfiguration
      references:
        - https://flask.palletsprojects.com/en/2.3.x/debugging/

  # ─── Flask host=0.0.0.0 sin debug check ───────────────────
  - id: flask-public-host
    pattern: app.run(host="0.0.0.0", ...)
    message: |
      Flask corriendo en 0.0.0.0 expone el servidor en todas las interfaces de red.
      En producción usar un WSGI server (gunicorn) con proxy reverso (nginx).
    languages: [python]
    severity: WARNING
    metadata:
      cwe: CWE-200

  # ─── pickle con datos de request ──────────────────────────
  - id: pickle-from-request
    patterns:
      - pattern: pickle.loads(...)
      - pattern-either:
          - pattern: pickle.loads($X)
            where: $X contains request
          - pattern: |
              $DATA = base64.$F(...)
              pickle.loads($DATA)
    message: |
      pickle.loads() con datos del request HTTP permite RCE. pickle puede ejecutar código
      arbitrario durante la deserialización. Usar JSON + firma HMAC en su lugar.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: CWE-502
      owasp: A08:2021 - Software and Data Integrity Failures

  # ─── os.popen / os.system con input ───────────────────────
  - id: os-popen-user-input
    patterns:
      - pattern-either:
          - pattern: os.popen(f"...$REQUEST_VAR...")
          - pattern: os.system(f"...$REQUEST_VAR...")
          - pattern: os.popen("..." + $REQUEST_VAR + "...")
          - pattern: os.system("..." + $REQUEST_VAR + "...")
    message: |
      os.popen/os.system con input de usuario — Command Injection.
      Usar subprocess.run(['cmd', arg], capture_output=True) con lista de argumentos.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: CWE-78
      owasp: A03:2021 - Injection

  # ─── render_template_string con input ─────────────────────
  - id: ssti-render-template-string
    patterns:
      - pattern: render_template_string($TEMPLATE % $USER_INPUT)
      - pattern: render_template_string($TEMPLATE.format(...))
    message: |
      render_template_string() con input de usuario — Server-Side Template Injection (SSTI).
      Pasar el input como variable al template, NO concatenarlo: render_template_string(tpl, var=input).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: CWE-94
      owasp: A03:2021 - Injection

  # ─── requests.get sin timeout ─────────────────────────────
  - id: requests-no-timeout
    patterns:
      - pattern: requests.get($URL)
      - pattern: requests.post($URL)
      - pattern: requests.request($METHOD, $URL)
    message: |
      requests.get/post sin timeout puede causar DoS si el servidor remoto no responde.
      Agregar timeout: requests.get(url, timeout=10)
    languages: [python]
    severity: WARNING
    metadata:
      cwe: CWE-400

  # ─── SQL concatenado en PHP ───────────────────────────────
  - id: php-sql-string-concat
    patterns:
      - pattern: $DB->query("..." . $VAR . "...")
      - pattern: $DB->query("...$VAR...")
      - pattern: mysqli_query($CONN, "..." . $VAR . "...")
    message: |
      SQL construido con concatenación de strings — SQL Injection.
      Usar prepared statements: $stmt = $db->prepare("SELECT ... WHERE x = ?"); $stmt->bind_param("s", $var);
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-89
      owasp: A03:2021 - Injection

  # ─── PHP echo de $_GET/$_POST sin escape ──────────────────
  - id: php-echo-user-input
    patterns:
      - pattern: echo $_GET[$KEY];
      - pattern: echo $_POST[$KEY];
      - pattern: echo $_REQUEST[$KEY];
      - pattern: print($_GET[$KEY]);
    message: |
      echo de input de usuario sin escape — Cross-Site Scripting (XSS).
      Usar: echo htmlspecialchars($_GET[$key], ENT_QUOTES, 'UTF-8');
    languages: [php]
    severity: ERROR
    metadata:
      cwe: CWE-79
      owasp: A03:2021 - Injection

  # ─── CORS origin reflection ────────────────────────────────
  - id: cors-origin-reflection
    patterns:
      - pattern: |
          $ORIGIN = $REQ.headers[$H];
          ...
          "Access-Control-Allow-Origin": $ORIGIN
    message: |
      CORS Origin Reflection — el servidor devuelve el Origin del request como Allow-Origin.
      Combinado con Allow-Credentials: true permite robo de sesión cross-origin.
      Usar allowlist explícita de orígenes permitidos.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: CWE-942
      owasp: A05:2021 - Security Misconfiguration

  # ─── X-Forwarded-For para autenticación ───────────────────
  - id: x-forwarded-for-auth
    patterns:
      - pattern-either:
          - pattern: $H.Get("X-Forwarded-For")
          - pattern: req.headers["x-forwarded-for"]
          - pattern: request.headers.get("X-Forwarded-For")
    message: |
      X-Forwarded-For es un header controlado por el cliente y NO debe usarse para
      autenticación o control de acceso — es trivialmente falsificable.
      Usar la IP real de la conexión TCP.
    languages: [go, javascript, python]
    severity: WARNING
    metadata:
      cwe: CWE-290
      owasp: A07:2021 - Identification and Authentication Failures

  # ─── MD5 para seguridad ────────────────────────────────────
  - id: md5-security-use
    patterns:
      - pattern: hashlib.md5(...)
      - pattern: md5($X)
    message: |
      MD5 es criptográficamente débil para propósitos de seguridad (colisiones conocidas).
      Para hashing de contraseñas: usar bcrypt, argon2, scrypt.
      Para integridad general: usar hashlib.sha256().
    languages: [python, php]
    severity: WARNING
    metadata:
      cwe: CWE-328
      owasp: A02:2021 - Cryptographic Failures
